<app-login *ngIf="!signedIn" (signedIn)="onSignedIn()"></app-login>

<div
  class="toast-error"
  *ngIf="sourceOpenError"
  (click)="sourceOpenError = null"
  title="Dismiss"
>
  {{ sourceOpenError }}
</div>

<nav class="mobile-nav" *ngIf="signedIn && !showAdmin">
  <button
    type="button"
    [class.active]="activePanel === 'documents'"
    (click)="setPanel('documents')"
  >
    Documents
  </button>
  <button type="button" [class.active]="activePanel === 'chat'" (click)="setPanel('chat')">
    Chat
  </button>
  <button
    type="button"
    [class.active]="activePanel === 'history'"
    (click)="setPanel('history')"
  >
    History
  </button>
</nav>

<div class="shell" *ngIf="signedIn && !showAdmin" [attr.data-panel]="activePanel">
  <app-documents
    [documents]="documents"
    [scanning]="scanning"
    [lastIngest]="lastIngest"
    [uploading]="uploading"
    [uploadProgress]="uploadProgress"
    [lastUpload]="lastUpload"
    [uploadError]="uploadError"
    [clearing]="clearing"
    [deletingName]="deletingDocumentName"
    (rescan)="rescan()"
    (upload)="upload($event)"
    (clearFolder)="clearFolder()"
    (deleteDocument)="deleteDocument($event)"
  ></app-documents>

  <app-chat
    [turns]="turns"
    [asking]="asking"
    [loadingThread]="loadingThread"
    [title]="activeTitle"
    [documents]="documents"
    (ask)="ask($event)"
    (newChat)="newChat()"
    (openSource)="openSourceDocument($event)"
  ></app-chat>

  <app-history
    [conversations]="conversations"
    [activeId]="activeConversationId"
    [loading]="loadingHistory"
    [username]="username"
    [isAdmin]="isAdmin"
    (newChat)="newChat()"
    (select)="openConversation($event)"
    (remove)="deleteConversation($event)"
    (signOut)="signOut()"
    (openAdmin)="showAdmin = true"
  ></app-history>
</div>

<div class="shell" *ngIf="signedIn && showAdmin">
  <app-admin [username]="username" (back)="showAdmin = false"></app-admin>
</div>
